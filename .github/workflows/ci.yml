name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.1
        run: sudo xcode-select -s /Applications/Xcode_16.1.app

      - name: Install dependencies
        run: make install-deps

      - name: Run lint
        run: make lint

      - name: Build project
        run: make build

      - name: Run tests
        run: make test

      - name: Run coverage check
        id: coverage
        run: |
          set -o pipefail
          set +e
          make coverage-check
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            build/coverage-summary.txt
            build/coverage-history.csv
            build/coverage.json

      - name: Enforce coverage threshold
        if: steps.coverage.outputs.status != '0'
        env:
          COVERAGE_STATUS: ${{ steps.coverage.outputs.status }}
        run: |
          echo "Coverage check failed with status: ${COVERAGE_STATUS}" >&2
          exit "${COVERAGE_STATUS}"
