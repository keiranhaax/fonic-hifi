name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select and inspect stable Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          selected_xcode="$({
            for app in /Applications/Xcode*.app; do
              [[ -d "$app" ]] || continue
              [[ "$app" =~ [Bb]eta|[Rr][Cc] ]] && continue
              version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
              [[ "$version" == 26.* ]] || continue
              printf '%s\t%s\n' "$version" "$app"
            done
          } | sort -V | tail -1 | cut -f2-)"
          test -n "$selected_xcode"
          sudo xcode-select -s "$selected_xcode/Contents/Developer"
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list runtimes available
          xcrun simctl list devices available
          xcrun simctl list devices available | grep -F 'iPhone 17 Pro'

      - name: Install dependencies
        run: make install-deps

      - name: Run lint
        run: make lint

      - name: Build project
        run: make build

      - name: Run tests
        run: make test

      - name: Run coverage check
        id: coverage
        run: |
          set -o pipefail
          set +e
          make coverage-check
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            build/coverage-summary.txt
            build/coverage-history.csv
            build/coverage.json

      - name: Enforce coverage threshold
        if: steps.coverage.outputs.status != '0'
        env:
          COVERAGE_STATUS: ${{ steps.coverage.outputs.status }}
        run: |
          echo "Coverage check failed with status: ${COVERAGE_STATUS}" >&2
          exit "${COVERAGE_STATUS}"
