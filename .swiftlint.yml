included:
  - Fonic HiFi
  - Fonic HiFiTests

excluded:
  - .build
  - build
  - build/SourcePackages
  - build/SourcePackages/**
  - sample
  - sample/**
  - specs
  - specs/**
  - Plan
  - Plan/**
  - plan2
  - plan2/**
  - plan3
  - plan3/**
  - .claude
  - .claude/**
  - .factory
  - .factory/**

disabled_rules:
  # Temporarily disable stylistic rules that require large-scale refactors in later phases
  - cyclomatic_complexity
  - file_length
  - function_body_length
  - function_parameter_count
  - identifier_name
  - large_tuple
  - multiple_closures_with_trailing_closure
  - orphaned_doc_comment
  - statement_position
  - void_function_in_ternary
  - for_where
  - type_body_length
  - type_name
  - trailing_comma

opt_in_rules:
  - fatal_error_message
  - force_cast
  - force_try
  - force_unwrapping
  - redundant_nil_coalescing
  - redundant_type_annotation
  - todo
  - unused_optional_binding

analyzer_rules:
  - unused_import

line_length:
  warning: 180
  error: 260
  ignores_comments: true
  ignores_urls: true
  ignores_function_declarations: true


custom_rules:
  no_print_statements:
    name: "Disallow print statements"
    regex: "\\bprint\\s*\\("
    match_kinds:
      - identifier
    message: "Use Logger instead of print()"
    severity: error
